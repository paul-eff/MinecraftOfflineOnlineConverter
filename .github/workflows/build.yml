name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "26"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew test --no-daemon

  package:
    name: Package
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "26"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build shadow JAR
        run: ./gradlew shadowJar --no-daemon

      - name: Upload shadow JAR
        uses: actions/upload-artifact@v4
        with:
          name: mooc-shadow-jar
          path: build/libs/MinecraftOfflineOnlineConverter-*.jar
          if-no-files-found: error

  javadoc:
    name: Javadoc
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "26"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Javadoc
        run: ./gradlew javadoc --no-daemon

      - name: Upload Javadoc artifact
        uses: actions/upload-artifact@v4
        with:
          name: mooc-javadoc
          path: build/docs/javadoc
          if-no-files-found: error

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/docs/javadoc

  deploy-pages:
    name: Deploy Javadoc to GitHub Pages
    needs: javadoc
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  pre-release:
    name: Pre-release
    needs: package
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve pre-release metadata
        id: meta
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF_NAME}"
          if [ "${BRANCH}" = "main" ]; then
            {
              echo "tag=pre-release"
              echo "title=Pre-release/development build (main)"
              echo "blurb=This is a rolling build from main which is overwritten on each green push."
              echo "skip=false"
            } >> "${GITHUB_OUTPUT}"
          else
            SAFE="$(printf '%s' "${BRANCH}" | tr '/' '-' | tr -cd 'A-Za-z0-9._-' | cut -c1-80)"
            if [ -z "${SAFE}" ]; then
              echo "Branch name sanitized to empty; skipping pre-release."
              echo "skip=true" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            {
              echo "tag=pre/${SAFE}"
              echo "title=Pre-release/development build (${BRANCH})"
              echo "blurb=This is a branch build which is overwritten on each green push."
              echo "skip=false"
            } >> "${GITHUB_OUTPUT}"
          fi

      - name: Download shadow JAR
        if: steps.meta.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          name: mooc-shadow-jar
          path: dist

      - name: Name pre-release JAR with commit SHA
        if: steps.meta.outputs.skip != 'true'
        id: jar
        run: |
          set -euo pipefail
          SHORT_SHA="$(printf '%.7s' "${GITHUB_SHA}")"
          mapfile -t JARS < <(find dist -maxdepth 1 -type f -name 'MinecraftOfflineOnlineConverter-*.jar' ! -name '*-thin.jar' | sort)
          if [ "${#JARS[@]}" -ne 1 ]; then
            echo "Expected exactly one shadow JAR in dist/, found ${#JARS[@]}"
            ls -la dist || true
            exit 1
          fi
          SRC="${JARS[0]}"
          DEST="dist/MinecraftOfflineOnlineConverter-${SHORT_SHA}.jar"
          mv "${SRC}" "${DEST}"
          {
            echo "path=${DEST}"
            echo "name=MinecraftOfflineOnlineConverter-${SHORT_SHA}.jar"
            echo "short_sha=${SHORT_SHA}"
          } >> "${GITHUB_OUTPUT}"
          echo "Pre-release JAR: ${DEST}"

      - name: Remove previous pre-release JAR assets
        if: steps.meta.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            echo "No existing release ${TAG}; nothing to clean."
            exit 0
          fi
          mapfile -t ASSETS < <(gh release view "${TAG}" --json assets --jq '.assets[].name')
          for name in "${ASSETS[@]:-}"; do
            case "${name}" in
              MinecraftOfflineOnlineConverter*.jar)
                echo "Deleting old asset: ${name}"
                gh release delete-asset "${TAG}" "${name}" --yes
                ;;
            esac
          done

      - name: Create or update pre-release
        if: steps.meta.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.meta.outputs.title }}
          prerelease: true
          make_latest: false
          generate_release_notes: false
          fail_on_unmatched_files: true
          body: |
            Automated **pre-release** from `${{ github.ref_name }}` (`${{ github.sha }}`).

            ${{ steps.meta.outputs.blurb }}

            This is **not** a stable release. For production use a full release.

            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: ${{ steps.jar.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
