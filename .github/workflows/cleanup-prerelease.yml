name: Cleanup pre-release

on:
  pull_request:
    types: [ closed ]
  delete:

permissions:
  contents: write

jobs:
  cleanup:
    name: Delete branch pre-release
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'pull_request' && github.head_ref != 'main' && github.head_ref != '') ||
      (github.event_name == 'delete' && github.event.ref_type == 'branch' && github.event.ref != 'main')
    steps:
      - name: Delete pre-release for branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "delete" ]; then
            BRANCH="${{ github.event.ref }}"
          else
            BRANCH="${{ github.head_ref }}"
          fi

          SAFE="$(printf '%s' "${BRANCH}" | tr '/' '-' | tr -cd 'A-Za-z0-9._-' | cut -c1-80)"
          TAG="pre/${SAFE}"

          if [ -z "${SAFE}" ] || [ "${TAG}" = "pre-release" ]; then
            echo "Refusing cleanup for '${BRANCH}'"
            exit 0
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release delete "${TAG}" --yes --cleanup-tag
            echo "Deleted ${TAG}"
          else
            echo "No release ${TAG}; nothing to do."
          fi
